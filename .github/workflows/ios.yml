# Builds an unsigned Suga.ipa on a Mac (iOS apps can only be built on macOS).
# Run it from the repo's Actions tab ("Build iOS" > "Run workflow"), or push to main.
# Download Suga-iOS from the finished run, then install it with Sideloadly or AltStore,
# which sign it with your Apple ID.
name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.7
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package Suga.ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr Suga.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Suga-iOS
          path: dist/Suga.ipa
