name: suga
description: "A practice metronome for Suga's hand-to-hand splits, with speed training, tap along and custom sounds."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.11
  file_picker: ^10.0.0
  record: ^6.2.0
  flutter_soloud: 3.5.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generated by tool/make_sounds.dart
  assets:
    - assets/sounds/don.wav
    - assets/sounds/pang.wav
    - assets/sounds/tsu.wav
    - assets/sounds/click.wav

