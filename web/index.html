<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A practice metronome for Suga's hand-to-hand splits.">
  <meta name="theme-color" content="#0E1014">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Suga">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Suga</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown until the app's first frame; the first visit downloads several MB. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0E1014; overscroll-behavior: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loading div {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #1C2029; border-top-color: #8A93A6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading').remove());
  </script>
  <!-- The audio engine (flutter_soloud) on the web. Deferred scripts run in order, so it is ready before the app. -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
